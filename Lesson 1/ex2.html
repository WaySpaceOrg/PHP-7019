<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#170d20;--pink:#ff58a7;--text:#fff4fb;--muted:#c1b0c6;--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;padding:0 22px 55px;color:var(--text);font-family:'Prompt','Kanit',system-ui,sans-serif;background:radial-gradient(ellipse at 85% 5%,rgba(173,108,224,.18),transparent 34rem),radial-gradient(ellipse at 5% 20%,rgba(255,79,163,.14),transparent 28rem),var(--bg);line-height:1.75}
.lesson-top{max-width:1040px;margin:0 auto 38px;padding:20px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}
.lesson-brand{font-weight:700;letter-spacing:1px;color:#fff;text-decoration:none}.lesson-brand small{display:block;color:#b79ab8;font-size:9px;letter-spacing:2px;font-weight:400}

h1,h2,h3{font-family:'Kanit','Prompt',sans-serif;line-height:1.3}h1{max-width:900px;margin:28px auto 15px;font-size:clamp(28px,5vw,42px);color:#ff9bc8}h2{color:#d5b7ff;margin-top:28px}p,li,label{color:#e5d7e8}a{color:#ff91c2}
body>h1,body>h2,body>p,body>form,body>table,body>img,body>ul,body>main,body>header:not(.lesson-top),body>footer:not(.lesson-footer),body>button,body>span{max-width:900px;margin-left:auto;margin-right:auto}
img{max-width:100%;height:auto;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
table{width:min(900px,100%);border-collapse:collapse;overflow:hidden;border-radius:15px;background:rgba(255,255,255,.045);margin:24px auto;border:1px solid var(--line)}caption{padding:14px;color:#ff9ac9;font-weight:600;font-size:18px}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--line)}th{background:rgba(255,79,163,.17);color:#ffc1dc}tr:last-child td{border-bottom:0}
form{width:min(680px,100%);margin:25px auto;padding:26px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 20px 55px rgba(0,0,0,.18)}
label{display:inline-block;margin:8px 8px 7px 0;font-size:13px}input:not([type=radio]):not([type=checkbox]),select,textarea{display:block;width:100%;margin:5px 0 15px;padding:12px 14px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:#1b1023;color:#fff;font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:#ff79b7;box-shadow:0 0 0 3px rgba(255,79,163,.12)}input[type=radio],input[type=checkbox]{accent-color:#ff58a7}
button{border:0;border-radius:99px;padding:12px 22px;background:linear-gradient(110deg,#ff58a7,#a978e8);color:white;font:600 13px 'Prompt',sans-serif;cursor:pointer;box-shadow:0 9px 24px rgba(255,79,163,.2);transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(1.08)}
nav:not(.lesson-top){display:flex;flex-wrap:wrap;gap:10px;margin:16px auto;max-width:900px}nav:not(.lesson-top) a{padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.045);text-decoration:none;font-size:12px}
ul{padding-left:24px}li{margin:6px 0}.lesson-footer{max-width:1040px;margin:50px auto 0;padding-top:18px;border-top:1px solid var(--line);color:#9d8ba4;text-align:center;font-size:11px}.lesson-footer a{color:#ff9ac9;text-decoration:none}
@media(max-width:600px){body{padding:0 14px 35px}.lesson-top{margin-bottom:24px}.back-btn{white-space:nowrap;padding:8px 12px}form{padding:19px 16px}th,td{padding:10px 8px;font-size:12px}}

/* Shared layout refinement: balanced, centered lesson content */
body { display:flex; flex-direction:column; align-items:center; }
body > * { width:min(900px,100%); margin-left:auto !important; margin-right:auto !important; }
body > .lesson-top, body > .topbar, body > .lesson-footer, body > footer { width:100%; max-width:1040px; }
body > main { width:min(900px,100%); margin:0 auto; }
body > h1, body > h2, body > p { text-align:center; }
body > img { display:block; width:auto; max-width:min(100%,720px); height:auto; margin:22px auto !important; object-fit:contain; }
body > form, body > table { width:min(760px,100%); margin:26px auto !important; text-align:left; }
body > ul { width:min(760px,100%); margin:18px auto !important; text-align:left; }
body > main > h1, body > main > h2, body > main > p { text-align:center; margin-left:auto; margin-right:auto; }
body > main > img, main img { display:block; width:auto; max-width:100%; height:auto; margin:22px auto !important; object-fit:contain; }
body > main > section, main > section { width:100%; margin:26px auto; padding:clamp(18px,3vw,30px); border:1px solid var(--line); border-radius:22px; background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025)); }
body > header:not(.lesson-top) { text-align:center; }
body > nav, main nav { justify-content:center; }
body > p { line-height:1.9; }
table { margin-left:auto !important; margin-right:auto !important; }
@media(max-width:600px) {
  body { padding-left:14px; padding-right:14px; }
  body > * { max-width:100%; }
  body > img { max-width:100%; }
}
